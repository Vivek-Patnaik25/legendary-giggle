# Render Blueprint Configuration for Pantry Rescue
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: pantry-rescue
    runtime: node
    plan: free # 100% Free Tier ($0/mo)
    region: oregon
    buildCommand: npm run build
    startCommand: npm run start:web
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0 # Pins to Active LTS Node 22 (avoids Node 24 better-sqlite3 assertion crash)
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        value: sqlite://./data/pantry.db
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
